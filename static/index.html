<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TFI meme బనిస</title>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --text: #221d16; --muted: #8a8177;
    --accent: #e8590c; --accent-2: #ffb703; --accent-soft: #fff1e3;
    --border: #eee7dc; --shadow: 0 1px 4px rgba(60,40,10,.08);
    --sheet-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141210; --card: #1f1c18; --text: #f2ede6; --muted: #9d948a;
      --accent: #ff7a2f; --accent-2: #ffb703; --accent-soft: #33220f;
      --border: #2c2823; --shadow: 0 1px 6px rgba(0,0,0,.4);
      --sheet-bg: #201d19;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, "Noto Sans Telugu", sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font: inherit; cursor: pointer; border: 0; }

  /* ---------- sticky header: brand + search ---------- */
  header {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    padding: .7rem 1rem .4rem; border-bottom: 1px solid var(--border);
  }
  .brand-row { display: flex; align-items: center; gap: .7rem; max-width: 1200px; margin: 0 auto; }
  .logo {
    font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; white-space: nowrap;
  }
  .logo .te { color: var(--accent); }
  .searchwrap {
    flex: 1; display: flex; align-items: center; gap: .5rem;
    background: var(--card); border: 1.5px solid var(--border); border-radius: 999px;
    padding: .5rem .9rem; box-shadow: var(--shadow);
  }
  .searchwrap:focus-within { border-color: var(--accent); }
  .searchwrap svg { flex: none; opacity: .5; }
  #q {
    flex: 1; border: 0; outline: 0; background: transparent; color: var(--text);
    font-size: 1rem; min-width: 0;
  }
  #clear-q { background: none; color: var(--muted); font-size: 1.1rem; display: none; padding: 0 .1rem; }
  .seg {
    display: flex; background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px; flex: none;
  }
  .seg button {
    background: none; color: var(--muted); border-radius: 999px; padding: .3rem .6rem; font-size: .95rem;
  }
  .seg button.on { background: var(--accent); color: #fff; }

  /* ---------- category chips ---------- */
  .cats {
    display: flex; gap: .45rem; overflow-x: auto; padding: .55rem .2rem .5rem;
    max-width: 1200px; margin: 0 auto; scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    flex: none; background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; padding: .4rem .85rem; font-size: .9rem; color: var(--text);
    white-space: nowrap; box-shadow: var(--shadow);
  }
  .cat.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  main { max-width: 1200px; margin: 0 auto; padding: .8rem 1rem 5rem; }
  .section-title {
    display: flex; align-items: baseline; gap: .6rem; margin: .9rem 0 .55rem;
    font-size: 1.02rem; font-weight: 700;
  }
  .section-title .sub { font-weight: 400; color: var(--muted); font-size: .82rem; }
  .section-title .back { margin-left: auto; background: none; color: var(--accent); font-size: .85rem; }

  /* ---------- packs rail ---------- */
  .packs {
    display: flex; gap: .7rem; overflow-x: auto; padding-bottom: .4rem; scrollbar-width: none;
  }
  .packs::-webkit-scrollbar { display: none; }
  .pack {
    flex: none; width: 108px; text-align: center; cursor: pointer;
  }
  .pack img {
    width: 96px; height: 96px; object-fit: cover; border-radius: 22px;
    background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow);
    transition: transform .15s;
  }
  .pack:hover img { transform: scale(1.06); }
  .pack .pname {
    font-size: .74rem; margin-top: .3rem; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pack .pcount { font-size: .68rem; color: var(--muted); }

  /* ---------- masonry sticker grid ---------- */
  #grid { column-count: 5; column-gap: .8rem; }
  @media (max-width: 1100px) { #grid { column-count: 4; } }
  @media (max-width: 860px)  { #grid { column-count: 3; } }
  @media (max-width: 560px)  { #grid { column-count: 2; } }
  .tile {
    break-inside: avoid; margin-bottom: .8rem; position: relative; cursor: pointer;
    border-radius: 18px; overflow: hidden; background: var(--card);
    border: 1px solid var(--border); box-shadow: var(--shadow);
    transition: transform .12s;
  }
  .tile:hover { transform: translateY(-2px) scale(1.015); }
  .tile img { width: 100%; display: block; }
  .tile .gif {
    position: absolute; top: .5rem; left: .5rem; background: rgba(0,0,0,.55);
    color: #fff; font-size: .62rem; font-weight: 700; padding: .1rem .4rem; border-radius: 6px;
  }
  .tile .quick {
    position: absolute; right: .45rem; bottom: .45rem; background: rgba(0,0,0,.55);
    color:#fff; border-radius: 999px; width: 30px; height: 30px; display: none;
    align-items: center; justify-content: center; font-size: .95rem;
  }
  .tile:hover .quick { display: flex; }
  #loadmore { display: block; margin: 1rem auto; background: var(--card); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: .55rem 1.4rem; }
  .empty { text-align: center; color: var(--muted); padding: 3rem 0; }
  .empty .big { font-size: 2.2rem; }

  /* ---------- bottom sheet / dialog ---------- */
  dialog#sheet {
    border: 0; padding: 0; background: transparent; max-width: 460px; width: 94vw;
  }
  dialog#sheet::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }
  .sheet-card {
    background: var(--sheet-bg); border-radius: 22px; overflow: hidden;
    border: 1px solid var(--border);
  }
  @media (max-width: 560px) {
    dialog#sheet {
      margin: auto 0 0; max-width: none; width: 100vw;
    }
    .sheet-card { border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom); }
  }
  .sheet-img { background: repeating-conic-gradient(var(--border) 0% 25%, transparent 0% 50%) 50%/24px 24px; text-align: center; }
  .sheet-img img { max-width: 100%; max-height: 46vh; display: block; margin: 0 auto; }
  .sheet-body { padding: .9rem 1rem 1.1rem; }
  .sheet-meta { font-size: .85rem; color: var(--muted); margin-bottom: .25rem; }
  .sheet-title { font-size: 1rem; font-weight: 700; margin-bottom: .15rem; min-height: 1.2em; }
  .tagrow { display: flex; flex-wrap: wrap; gap: .35rem; margin: .4rem 0 .7rem; }
  .tag { font-size: .72rem; background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; padding: .15rem .6rem; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: .55rem; }
  .actions button {
    display: flex; flex-direction: column; align-items: center; gap: .15rem;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: .6rem .2rem; color: var(--text); font-size: .78rem;
  }
  .actions button .ico { font-size: 1.25rem; }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rate { display: flex; gap: .15rem; justify-content: center; margin-top: .7rem; font-size: 1.3rem; }
  .rate span { cursor: pointer; filter: grayscale(1); opacity: .45; }
  .rate span.on { filter: none; opacity: 1; }
  .morelike { width: 100%; margin-top: .7rem; background: none; color: var(--accent);
    border: 1px dashed var(--accent); border-radius: 12px; padding: .5rem; font-size: .85rem; }
  details.editbox { margin-top: .8rem; border-top: 1px solid var(--border); padding-top: .6rem; }
  details.editbox summary { color: var(--muted); font-size: .82rem; cursor: pointer; }
  .editgrid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: .6rem; }
  .editgrid label { font-size: .72rem; color: var(--muted); display: flex; flex-direction: column; gap: .15rem; }
  .editgrid label.wide { grid-column: 1 / -1; }
  .editgrid input, .editgrid textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: .45rem .6rem; font: inherit;
  }
  .savebtn { grid-column: 1/-1; background: var(--accent); color: #fff; border-radius: 10px; padding: .55rem; }
  .closex {
    position: absolute; top: .6rem; right: .6rem; background: rgba(0,0,0,.5); color: #fff;
    width: 32px; height: 32px; border-radius: 999px; font-size: 1rem; z-index: 2;
  }

  /* ---------- upload FAB + panel ---------- */
  #fab {
    position: fixed; right: 1.1rem; bottom: 1.2rem; z-index: 15;
    width: 56px; height: 56px; border-radius: 999px; background: var(--accent); color: #fff;
    font-size: 1.6rem; box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }
  dialog#upsheet { border: 0; border-radius: 20px; background: var(--sheet-bg); color: var(--text);
    max-width: 420px; width: 92vw; padding: 1.1rem; }
  dialog#upsheet::backdrop { background: rgba(0,0,0,.5); }
  #upsheet input[type=text] { width: 100%; margin-top: .5rem; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: .55rem .7rem; font: inherit; }
  #upsheet .drop {
    border: 2px dashed var(--border); border-radius: 14px; padding: 1.4rem; text-align: center;
    color: var(--muted); cursor: pointer;
  }
  #upsheet .drop.has { border-color: var(--accent); color: var(--accent); }
  #upsheet .send { width: 100%; margin-top: .8rem; background: var(--accent); color: #fff;
    border-radius: 12px; padding: .7rem; font-weight: 600; }
  #upsheet progress { width: 100%; margin-top: .6rem; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 5.5rem; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); border-radius: 999px; padding: .5rem 1.1rem;
    font-size: .85rem; opacity: 0; pointer-events: none; transition: all .25s; z-index: 30;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="logo">TFI meme <span class="te">బనిస</span></div>
    <div class="searchwrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off"
             placeholder="Search a feeling, dialogue, actor…">
      <button id="clear-q" aria-label="clear">✕</button>
    </div>
    <div class="seg" id="typeseg">
      <button data-t="" class="on" title="All">All</button>
      <button data-t="false" title="Static stickers">🖼</button>
      <button data-t="true" title="Animated stickers">🎞</button>
    </div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="cats" id="actor-chips" style="padding-top:0"></div>
</header>

<main>
  <div class="section-title" id="section-title">
    <span id="st-label">✨ Fresh stickers</span><span class="sub" id="st-sub"></span>
    <button class="back" id="st-back" hidden>← All stickers</button>
  </div>
  <div class="packs" id="packs"></div>
  <div id="grid"></div>
  <div class="empty" id="empty" hidden><div class="big">🫥</div>No stickers found — try another word or upload your own!</div>
  <button id="loadmore" hidden>Show more</button>
</main>

<button id="fab" title="Upload a meme">＋</button>

<!-- sticker detail sheet -->
<dialog id="sheet">
  <div class="sheet-card" style="position:relative">
    <button class="closex" id="sheet-close">✕</button>
    <div class="sheet-img"><img id="sh-img" alt="sticker"></div>
    <div class="sheet-body">
      <div class="sheet-title" id="sh-title"></div>
      <div class="sheet-meta" id="sh-meta"></div>
      <div class="tagrow" id="sh-tags"></div>
      <div class="actions">
        <button class="primary" id="a-copy"><span class="ico">📋</span>Copy</button>
        <button id="a-share"><span class="ico">📤</span>Share</button>
        <button id="a-save"><span class="ico">⬇️</span>Save</button>
      </div>
      <div class="rate" id="rate"></div>
      <button class="morelike" id="a-morelike">✨ More like this</button>
      <details class="editbox">
        <summary>✏️ Edit details (dialogue, movie, tags)</summary>
        <form class="editgrid" id="edit-form">
          <label class="wide">⭐ Description — what this sticker means / when to send it
            <textarea name="description" rows="2" placeholder="e.g. smug comedian shrugging off blame, use when dodging responsibility"></textarea></label>
          <label class="wide">Dialogue (Telugu)<textarea name="dialogue_te" rows="2"></textarea></label>
          <label class="wide">Dialogue (English)<textarea name="dialogue_en" rows="1"></textarea></label>
          <label>Movie<input name="movie_title_en"></label>
          <label>Actors (comma)<input name="actors"></label>
          <label>Emotions (comma)<input name="emotion_tags"></label>
          <label>Tags (comma)<input name="context_tags"></label>
          <button class="savebtn" type="submit">Save & mark verified</button>
        </form>
      </details>
    </div>
  </div>
</dialog>

<!-- upload sheet -->
<dialog id="upsheet">
  <h3 style="margin:.1rem 0 .7rem">Upload a meme</h3>
  <div class="drop" id="drop">Tap to choose an image<br><small>JPEG · PNG · WebP, up to 10 MB</small></div>
  <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
  <input type="text" id="u-dialogue" placeholder="Dialogue (Telugu) — optional">
  <input type="text" id="u-movie" placeholder="Movie — optional">
  <input type="text" id="u-tags" placeholder="Tags: comedy, chiranjeevi — optional">
  <button class="send" id="u-send">Upload</button>
  <progress id="u-progress" max="100" value="0" hidden></progress>
  <div id="u-msg" style="font-size:.85rem;margin-top:.4rem;color:var(--muted)"></div>
</dialog>

<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const api = (path, opts) => fetch(path, opts).then(async (r) => {
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
});
const toast = (msg) => {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
};

// Categories are semantic searches — powered by the embedding engine.
const CATS = [
  ['🔥', 'Trending', null],
  ['😂', 'Comedy', 'funny laughing comedy'],
  ['😢', 'Sad', 'sad crying tears emotional'],
  ['😡', 'Angry', 'angry shouting rage fight'],
  ['❤️', 'Love', 'love romantic heart'],
  ['🎉', 'Party', 'celebration dance party'],
  ['🙏', 'Greetings', 'namaste greeting wishes thank you'],
  ['🎂', 'Birthday', 'birthday wishes cake'],
  ['😲', 'Shock', 'shocked surprised omg'],
  ['🤔', 'Confused', 'thinking confused doubt'],
  ['👍', 'Super', 'thumbs up ok super approve'],
];

const state = { animated: null, cat: 'Trending', actor: null, pack: null, offset: 0, mode: 'browse', memes: [], current: null };

// ---------- actor chips (face-recognition tags) ----------
async function loadActorChips() {
  const { actors } = await api('/api/actors');
  const el = $('#actor-chips'); el.innerHTML = '';
  for (const a of actors) {
    const c = document.createElement('button');
    c.className = 'cat' + (state.actor === a ? ' on' : '');
    c.textContent = `⭐ ${a}`;
    c.onclick = () => {
      state.actor = state.actor === a ? null : a;
      state.pack = null;
      document.querySelectorAll('#actor-chips .cat').forEach((x) =>
        x.classList.toggle('on', x.textContent === `⭐ ${state.actor}`));
      refresh();
    };
    el.appendChild(c);
  }
}

// ---------- header controls ----------
document.querySelectorAll('#typeseg button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('#typeseg button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    state.animated = b.dataset.t === '' ? null : b.dataset.t === 'true';
    refresh();
  };
});
let deb;
$('#q').addEventListener('input', () => {
  $('#clear-q').style.display = $('#q').value ? 'block' : 'none';
  clearTimeout(deb); deb = setTimeout(refresh, 300);
});
$('#clear-q').onclick = () => { $('#q').value = ''; $('#clear-q').style.display = 'none'; refresh(); };

// ---------- category chips ----------
const catsEl = $('#cats');
for (const [emoji, name] of CATS) {
  const c = document.createElement('button');
  c.className = 'cat' + (name === state.cat ? ' on' : '');
  c.textContent = `${emoji} ${name}`;
  c.dataset.name = name;
  c.onclick = () => {
    state.cat = name; state.pack = null; $('#q').value = '';
    document.querySelectorAll('.cat').forEach((x) => x.classList.toggle('on', x.dataset.name === name));
    refresh();
  };
  catsEl.appendChild(c);
}

// ---------- data loading ----------
async function refresh() {
  state.offset = 0; state.memes = [];
  const q = $('#q').value.trim();
  const catQuery = (CATS.find((c) => c[1] === state.cat) || [])[2];
  $('#st-back').hidden = !state.pack;
  $('#packs').style.display = (q || state.pack || state.actor || state.cat !== 'Trending') ? 'none' : 'flex';

  if (state.pack) {
    state.mode = 'pack';
    $('#st-label').textContent = `📦 ${state.pack}`;
    await loadPage();
  } else if (q || catQuery || state.actor) {
    state.mode = 'search';
    $('#st-label').textContent = state.actor && !q
      ? `⭐ ${state.actor}`
      : (q ? `Results for “${q}”` : `${state.cat} stickers`);
    const body = { query: q || (state.actor ? state.actor : catQuery), limit: 40 };
    if (state.actor) body.actors = [state.actor];
    if (state.animated !== null) body.animated = state.animated;
    try {
      const res = await api('/api/memes/search', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      state.memes = res.results.map((r) => r.meme);
      $('#st-sub').textContent = res.query_telugu ? `searched as “${res.query_telugu}”` : `${res.duration_ms} ms`;
      renderGrid(true);
      $('#loadmore').hidden = true;
    } catch (e) { toast('Search failed: ' + e.message); }
  } else {
    state.mode = 'browse';
    $('#st-label').textContent = '✨ Fresh stickers';
    $('#st-sub').textContent = '';
    await loadPage();
    loadPacks();
  }
}

async function loadPage() {
  let url = `/api/memes?limit=40&offset=${state.offset}`;
  if (state.animated !== null) url += `&animated=${state.animated}`;
  if (state.pack) url += `&pack=${encodeURIComponent(state.pack)}`;
  const res = await api(url);
  state.memes = state.memes.concat(res.memes);
  if (state.mode !== 'search') $('#st-sub').textContent = `${res.total} stickers`;
  renderGrid(state.offset === 0);
  state.offset += 40;
  $('#loadmore').hidden = state.memes.length >= res.total;
}
$('#loadmore').onclick = loadPage;
$('#st-back').onclick = () => { state.pack = null; refresh(); };

async function loadPacks() {
  const { packs } = await api('/api/packs?limit=30');
  const el = $('#packs'); el.innerHTML = '';
  for (const p of packs) {
    const d = document.createElement('div');
    d.className = 'pack';
    d.innerHTML = `<img src="${p.cover_url}" loading="lazy" alt="">
      <div class="pname">${p.name}</div><div class="pcount">${p.count} stickers</div>`;
    d.onclick = () => { state.pack = p.name; refresh(); };
    el.appendChild(d);
  }
}

function renderGrid(reset) {
  const grid = $('#grid');
  if (reset) grid.innerHTML = '';
  $('#empty').hidden = state.memes.length > 0;
  const start = reset ? 0 : grid.children.length;
  for (const m of state.memes.slice(start)) {
    const t = document.createElement('div');
    t.className = 'tile';
    t.innerHTML = `<img src="${m.image_url}" loading="lazy" alt="">
      ${m.animated ? '<span class="gif">GIF</span>' : ''}
      <button class="quick" title="Copy">📋</button>`;
    t.querySelector('img').onclick = () => openSheet(m);
    t.querySelector('.quick').onclick = (e) => { e.stopPropagation(); copyImage(m); };
    grid.appendChild(t);
  }
}

// ---------- sticker actions ----------
async function imgBlob(m) { return (await fetch(m.image_url)).blob(); }
async function asPngBlob(m) {
  // Clipboard API accepts PNG; stickers are webp — convert via canvas.
  const bmp = await createImageBitmap(await imgBlob(m));
  const c = Object.assign(document.createElement('canvas'), { width: bmp.width, height: bmp.height });
  c.getContext('2d').drawImage(bmp, 0, 0);
  return new Promise((res) => c.toBlob(res, 'image/png'));
}
async function copyImage(m) {
  try {
    const blob = await asPngBlob(m);
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    toast('Copied! Paste it anywhere 📋');
  } catch { toast('Copy not supported here — use Save'); }
}
async function shareImage(m) {
  try {
    const blob = await imgBlob(m);
    const file = new File([blob], 'sticker.webp', { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
    } else { toast('Sharing not supported on this device'); }
  } catch (e) { if (e.name !== 'AbortError') toast('Share failed'); }
}
function saveImage(m) {
  const a = document.createElement('a');
  a.href = m.image_url; a.download = `tfi-meme-${m.id}.webp`;
  document.body.appendChild(a); a.click(); a.remove();
}

// ---------- detail sheet ----------
const listFields = ['actors', 'emotion_tags', 'context_tags'];
function openSheet(m) {
  state.current = m;
  $('#sh-img').src = m.image_url;
  $('#sh-title').textContent = m.dialogue_te || m.dialogue_en || m.description || '';
  const meta = [];
  if (m.movie_title_en) meta.push(`🎬 ${m.movie_title_en}`);
  if ((m.context_tags || [])[0]) meta.push(`📦 ${m.context_tags[0]}`);
  $('#sh-meta').textContent = meta.join('  ·  ');
  const tags = $('#sh-tags'); tags.innerHTML = '';
  for (const a of (m.actors || [])) tags.insertAdjacentHTML('beforeend', `<span class="tag">⭐ ${a}</span>`);
  for (const e of (m.emotion_tags || [])) tags.insertAdjacentHTML('beforeend', `<span class="tag">${e}</span>`);
  if (m.verified) tags.insertAdjacentHTML('beforeend', `<span class="tag">✔ verified</span>`);
  renderStars(m.rating || 0);
  const f = $('#edit-form');
  for (const el of f.elements) {
    if (!el.name) continue;
    const v = m[el.name];
    el.value = listFields.includes(el.name) ? (v || []).join(', ') : (v || '');
  }
  f.parentElement.open = false;
  $('#sheet').showModal();
}
$('#sheet-close').onclick = () => $('#sheet').close();
$('#sheet').onclick = (e) => { if (e.target === $('#sheet')) $('#sheet').close(); };
$('#a-copy').onclick = () => copyImage(state.current);
$('#a-share').onclick = () => shareImage(state.current);
$('#a-save').onclick = () => saveImage(state.current);
$('#a-morelike').onclick = () => {
  const m = state.current;
  $('#sheet').close();
  $('#q').value = m.dialogue_te || m.caption || m.dialogue_en || '';
  refresh();
};
function renderStars(n) {
  const r = $('#rate'); r.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const s = document.createElement('span');
    s.textContent = '⭐'; s.className = i <= n ? 'on' : '';
    s.onclick = async () => {
      await api(`/api/memes/${state.current.id}/rate`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rating: i }),
      });
      state.current.rating = i; renderStars(i); toast('Rated ⭐'.repeat(1));
    };
    r.appendChild(s);
  }
}
$('#edit-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {};
  for (const el of e.target.elements) {
    if (!el.name) continue;
    body[el.name] = listFields.includes(el.name)
      ? el.value.split(',').map((s) => s.trim()).filter(Boolean)
      : (el.value || null);
  }
  try {
    await api(`/api/memes/${state.current.id}/edit`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    toast('Saved ✔ — re-indexing');
    $('#sheet').close();
  } catch (err) { toast('Save failed: ' + err.message); }
});

// ---------- upload ----------
$('#fab').onclick = () => $('#upsheet').showModal();
$('#drop').onclick = () => $('#file').click();
$('#file').onchange = () => {
  const f = $('#file').files[0];
  $('#drop').classList.toggle('has', !!f);
  if (f) $('#drop').innerHTML = `✔ ${f.name}`;
};
$('#u-send').onclick = async () => {
  const f = $('#file').files[0];
  if (!f) return toast('Pick an image first');
  const fd = new FormData();
  fd.append('file', f);
  if ($('#u-dialogue').value) fd.append('dialogue_te', $('#u-dialogue').value);
  if ($('#u-movie').value) fd.append('movie_title_en', $('#u-movie').value);
  if ($('#u-tags').value) fd.append('context_tags', $('#u-tags').value);
  const bar = $('#u-progress'), msg = $('#u-msg');
  bar.hidden = false; bar.value = 10; msg.textContent = 'Uploading…';
  try {
    const res = await api('/api/memes/upload', { method: 'POST', body: fd });
    msg.textContent = 'Auto-tagging (caption · OCR · index)…';
    const id = res.meme.id;
    const h = setInterval(async () => {
      const s = await api(`/api/memes/${id}/status`).catch(() => null);
      if (!s) return clearInterval(h);
      bar.value = s.progress;
      if (s.status === 'done') {
        clearInterval(h); bar.hidden = true;
        msg.textContent = ''; $('#upsheet').close(); toast('Sticker added ✔');
        $('#file').value = ''; $('#drop').classList.remove('has');
        $('#drop').innerHTML = 'Tap to choose an image<br><small>JPEG · PNG · WebP, up to 10 MB</small>';
        refresh();
      }
    }, 600);
  } catch (e) { msg.textContent = 'Upload failed: ' + e.message; bar.hidden = true; }
};

refresh();
loadActorChips();
</script>
</body>
</html>
